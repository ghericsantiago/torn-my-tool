<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Portfolio Tracker</h1>
            <div class="api-key-toggle">
                <button id="toggleApiKey">
                    <i class="fas fa-key"></i> API Key
                </button>
            </div>
        </header>

        <div class="controls">
            <div class="control-group api-key-group" style="display: none;">
                <label for="apiKey">API Key:</label>
                <input type="password" id="apiKey" class="form-control api-key-input" placeholder="Enter your API key">
                <button class="refresh-btn" id="saveApiKey">
                    <i class="fas fa-save"></i> Save
                </button>
            </div>
            <div class="control-group">
                <label for="itemSearch">Item Name:</label>
                <input type="text" id="itemSearch" class="form-control search-input" placeholder="Search items...">
            </div>
            <div class="control-group">
                <label for="startDate">From:</label>
                <input type="text" id="startDate" class="form-control date-input" placeholder="Start date">
            </div>
            <div class="control-group">
                <label for="endDate">To:</label>
                <input type="text" id="endDate" class="form-control date-input" placeholder="End date">
            </div>
            <div class="control-group">
                <label for="taxRate">Tax %:</label>
                <input type="number" id="taxRate" class="form-control" value="5" min="0" max="100" step="0.1" style="width:70px">
            </div>
            <button class="refresh-btn" id="applyFilters">
                <i class="fas fa-filter"></i> Apply
            </button>
            <button class="refresh-btn" id="clearFilters">
                <i class="fas fa-broom"></i> Clear
            </button>
            <button class="refresh-btn" id="refreshBtn">
                <i class="fas fa-sync-alt"></i> Refresh
            </button>
            <button class="refresh-btn" id="exportBtn">
                <i class="fas fa-file-export"></i> Export
            </button>
        </div>

        <div class="summary-card">
            <div class="summary-item">
                <span>Total Items:</span>
                <span id="totalItems">0</span>
            </div>
            <div class="summary-item">
                <span>Total Value:</span>
                <span id="totalValue">$0.00</span>
            </div>
            <div class="summary-item">
                <span>Profit/Loss:</span>
                <span id="profitLoss">$0.00</span>
            </div>
            <div class="summary-item">
                <span>Potential Income:</span>
                <span id="potentialIncome">$0.00</span>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="valueChart"></canvas>
        </div>

        <div class="data-container">
            <div class="card">
                <div class="card-header buy-header">
                    <span>Items Purchased</span>
                    <span class="summary-badge" id="buySummary">0 items</span>
                </div>
                <div class="card-body">
                    <div id="buyLoading" class="loading">
                        <div class="spinner"></div>
                    </div>
                    <table id="buyTable">
                        <thead>
                            <tr>
                                <th>Item</th>
                                <th>Store</th>
                                <th>Qty</th>
                                <th>Avg</th>
                                <th>Total</th>
                                <th>Current Price</th>
                                <th>Potential Income</th>
                                <th>Last Transaction</th>
                            </tr>
                        </thead>
                        <tbody id="buyTableBody"></tbody>
                    </table>
                </div>
            </div>

            <div class="card">
                <div class="card-header sell-header">
                    <span>Items Sold</span>
                    <span class="summary-badge" id="sellSummary">0 items</span>
                </div>
                <div class="card-body">
                    <div id="sellLoading" class="loading">
                        <div class="spinner"></div>
                    </div>
                    <table id="sellTable">
                        <thead>
                            <tr>
                                <th>Item</th>
                                <th>Store</th>
                                <th>Qty</th>
                                <th>Avg</th>
                                <th>Total</th>
                                <th>Current Price</th>
                                <th>Potential Income</th>
                                <th>Last Transaction</th>
                            </tr>
                        </thead>
                        <tbody id="sellTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="apiStatus" style="display: none;"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
